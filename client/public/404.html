<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#eef9ff" />
    <title>Page not found | Splash Kids Waterpark</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17314b;
        background: #eef9ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 12% 8%, #fff4bc 0 7%, transparent 7.5%), radial-gradient(circle at 90% 92%, #c9f4ff 0 16%, transparent 16.5%), #eef9ff;
      }
      main {
        width: min(100%, 720px);
        padding: clamp(28px, 6vw, 64px);
        text-align: center;
        background: #fff;
        border: 1px solid #d9edf5;
        border-radius: 28px;
        box-shadow: 0 24px 64px rgba(18, 61, 89, .12);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #e8f8ff;
        color: #0879ae;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .09em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        width: 9px;
        height: 9px;
        content: "";
        border-radius: 50%;
        background: #ffd247;
      }
      .logo {
        display: block;
        width: min(100%, 320px);
        height: auto;
        margin: 24px auto 8px;
      }
      h1 {
        margin: 16px 0 12px;
        color: #163450;
        font-size: clamp(32px, 7vw, 52px);
        line-height: 1.08;
        letter-spacing: -.04em;
      }
      .intro {
        max-width: 520px;
        margin: 0 auto;
        color: #52677a;
        font-size: 18px;
        line-height: 1.65;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 28px 0 20px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 18px;
        border: 1px solid #cce4ef;
        border-radius: 999px;
        color: #17314b;
        background: #fff;
        font-size: 15px;
        font-weight: 750;
        text-decoration: none;
      }
      nav a:hover { border-color: #0789c7; background: #f0faff; }
      nav a:focus-visible { outline: 3px solid #f1bf27; outline-offset: 3px; }
      nav a.primary {
        border-color: #087fb8;
        color: #fff;
        background: #087fb8;
      }
      nav a.primary:hover { border-color: #066a9a; background: #066a9a; }
      .note {
        margin: 0;
        color: #63788b;
        font-size: 14px;
        line-height: 1.6;
      }
      @media (max-width: 480px) {
        body { padding: 16px; }
        main { padding: 28px 20px; border-radius: 22px; }
        nav { align-items: stretch; flex-direction: column; }
        nav a { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">404 · Page not found</span>
      <img class="logo" src="/images/brand/splash-kids-logo.webp" alt="Splash Kids Waterpark logo" />
      <h1>That page took a wrong turn.</h1>
      <p class="intro">We couldn’t find this address, but you’re only a splash away from our park information.</p>
      <nav aria-label="Helpful links">
        <a class="primary" href="/">Back to Home</a>
        <a href="/contact/">Contact the team</a>
        <a href="tel:+27648200293">Call +27 64 820 0293</a>
      </nav>
      <p class="note">Looking for visit plans, prices or activities? Start at Home or contact the team for help.</p>
    </main>
  </body>
</html>
